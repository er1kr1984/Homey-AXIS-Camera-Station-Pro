<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    html, body { margin: 0; height: 100%; background: transparent; }
    #grid {
      position: absolute; inset: 0; display: grid; gap: 2px;
      background: #111; border-radius: var(--homey-border-radius-default, 10px); overflow: hidden;
    }
    .tile { position: relative; background: #000; overflow: hidden; min-width: 0; min-height: 0; }
    .tile video, .tile img { width: 100%; height: 100%; object-fit: contain; display: block; background: #000; }
    .tile img { position: absolute; inset: 0; }
    .tile .badge {
      position: absolute; right: 6px; top: 5px; padding: 1px 5px; border-radius: 4px;
      font: 600 9px/1.4 var(--homey-font-family, sans-serif); color: #fff; background: rgba(0,0,0,.55);
    }
    .tile .label {
      position: absolute; left: 6px; bottom: 5px; max-width: calc(100% - 12px);
      font: 500 11px/1.3 var(--homey-font-family, sans-serif); color: #fff;
      text-shadow: 0 1px 2px rgba(0,0,0,.8); white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .tile .status {
      position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; text-align: center;
      font: 12px/1.3 var(--homey-font-family, sans-serif); color: #bbb; padding: 8px; pointer-events: none;
    }
    .tile.live .status { display: none; }
    /* Tapped tile fills the widget */
    #grid.zoomed .tile { display: none; }
    #grid.zoomed .tile.zoom { display: block; grid-row: 1 / -1 !important; grid-column: 1 / -1 !important; }
    #message {
      position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; text-align: center;
      padding: 16px; font: 14px/1.4 var(--homey-font-family, sans-serif); color: var(--homey-text-color, #888);
    }
  </style>
</head>
<body>
  <div id="grid"></div>
  <div id="message" hidden></div>
  <script type="text/javascript">
    function onHomeyReady(Homey) {
      const settings = Homey.getSettings() || {};
      const source = settings.source;
      const quality = settings.quality || 'low';
      const grid = document.getElementById('grid');
      const message = document.getElementById('message');
      const tiles = [];
      const STAGGER_MS = 500; // spread connection set-up so Homey isn't hit all at once
      const ICE_WAIT_MS = 2500;
      const RETRY_MS = 4000;
      // Live video needs a direct connection to Homey (home network). If it can't connect
      // in time (e.g. on mobile data), show pictures refreshed through Homey's normal
      // remote connection instead, and try live again later.
      const LIVE_TIMEOUT_MS = 8000;
      const PICTURE_EVERY_MS = 2000;
      // First live retry comes quickly (a single failed attempt is usually a hiccup),
      // later ones once a minute (e.g. on a mobile network that blocks direct connections).
      const LIVE_RETRY_FIRST_MS = 10000;
      const LIVE_RETRY_MS = 60000;
      // Homey can only relay a few live streams at once: the first tiles play live, the
      // rest show pictures. Tapping a tile enlarges it and plays it live.
      const MAX_LIVE_TILES = 4;
      // When WebRTC can't connect (e.g. mobile data), video comes over Homey's normal
      // remote connection instead: Camera Station's MP4 stream, asked for every 0.4 s and
      // played by the browser's own video player. Pictures are the last resort.
      const HTTP_POLL_MS = 400;
      const HTTP_MAX_ERRORS = 5;
      const HTTP_STUCK_MS = 8000;
      const MediaSourceClass = window.ManagedMediaSource || window.MediaSource || null;
      let zoomedTile = null;
      const mayGoLive = (tile) => (zoomedTile ? tile === zoomedTile : tile.index < MAX_LIVE_TILES);

      function showMessage(text) {
        message.textContent = text;
        message.hidden = false;
        grid.hidden = true;
      }

      function waitForIce(pc) {
        if (pc.iceGatheringState === 'complete') return Promise.resolve();
        return new Promise((resolve) => {
          const timer = setTimeout(resolve, ICE_WAIT_MS);
          pc.addEventListener('icegatheringstatechange', () => {
            if (pc.iceGatheringState === 'complete') { clearTimeout(timer); resolve(); }
          });
        });
      }

      // retryLive: try live video again later (false for tiles over the live limit).
      function startPictures(tile, retryLive = true) {
        if (tile.pictureTimer || document.hidden) return;
        tile.badge.hidden = false;
        tile.badge.textContent = Homey.__('widget.pictureBadge');
        const refresh = async () => {
          try {
            const { jpeg } = await Homey.api('POST', '/snapshot', { source, sourceId: tile.sourceId });
            tile.img.src = `data:image/jpeg;base64,${jpeg}`;
            tile.img.hidden = false;
            tile.el.classList.add('live');
          } catch (e) { /* keep the last picture */ }
        };
        refresh();
        tile.pictureTimer = setInterval(refresh, PICTURE_EVERY_MS);
        // See if live video works again (e.g. back on Wi-Fi).
        if (retryLive) tile.liveRetry = setTimeout(() => connect(tile), tile.liveRetries++ ? LIVE_RETRY_MS : LIVE_RETRY_FIRST_MS);
      }

      const fromBase64 = (b64) => Uint8Array.from(atob(b64), (c) => c.charCodeAt(0));

      // Live video over HTTP. Resolves true when it started.
      async function startHttp(tile) {
        if (!MediaSourceClass || document.hidden) return false;
        let first;
        try {
          first = await Homey.api('POST', '/mp4', { source, sourceId: tile.sourceId, after: null, quality });
        } catch (e) {
          return false;
        }
        const type = `video/mp4; codecs="${first.codec}"`;
        if (!first.codec || !MediaSourceClass.isTypeSupported(type) || document.hidden) return false;
        const ms = new MediaSourceClass();
        const video = tile.video;
        const http = {
          ms, url: URL.createObjectURL(ms), seq: first.seq, queue: [], errors: 0, stopped: false,
        };
        tile.http = http;
        video.disableRemotePlayback = true; // required by ManagedMediaSource (iPhone)
        video.srcObject = null;
        video.src = http.url;
        await new Promise((resolve) => ms.addEventListener('sourceopen', resolve, { once: true }));
        if (http.stopped) return true;
        const sb = ms.addSourceBuffer(type);
        sb.mode = 'segments';
        const pump = () => {
          if (http.stopped || sb.updating || !http.queue.length) return;
          try { sb.appendBuffer(http.queue.shift()); } catch (e) { /* quota or closed: skip */ }
        };
        sb.addEventListener('updateend', () => {
          const b = sb.buffered;
          if (b.length) {
            const end = b.end(b.length - 1);
            // Stay close to live, and drop what was played long ago.
            if (end - video.currentTime > 2.5) video.currentTime = Math.max(b.start(b.length - 1), end - 0.3);
            if (video.currentTime - b.start(0) > 20 && !sb.updating) {
              try { sb.remove(b.start(0), video.currentTime - 10); return; } catch (e) { /* ignore */ }
            }
          }
          pump();
        });
        http.queue.push(fromBase64(first.init));
        if (first.data) http.queue.push(fromBase64(first.data));
        pump();
        video.play().catch(() => {});
        tile.badge.hidden = false;
        tile.badge.textContent = Homey.__('widget.httpBadge');
        tile.el.classList.add('live');
        const loop = async () => {
          if (http.stopped) return;
          try {
            const r = await Homey.api('POST', '/mp4', { source, sourceId: tile.sourceId, after: http.seq, quality });
            if (r.restart && r.init) http.queue.push(fromBase64(r.init));
            if (r.data) http.queue.push(fromBase64(r.data));
            http.seq = r.seq;
            http.errors = 0;
            pump();
          } catch (e) {
            if (++http.errors >= HTTP_MAX_ERRORS) {
              stopHttp(tile);
              startPictures(tile);
              return;
            }
          }
          http.timer = setTimeout(loop, HTTP_POLL_MS);
        };
        http.timer = setTimeout(loop, HTTP_POLL_MS);
        // Safety net: if this browser can't actually play it (no progress for 8 s), use
        // pictures instead of showing a still or black tile.
        let lastTime = -1;
        let stuckSince = Date.now();
        http.watchdog = setInterval(() => {
          if (http.stopped) return;
          if (video.currentTime !== lastTime && video.readyState >= 2) {
            lastTime = video.currentTime;
            stuckSince = Date.now();
          } else if (Date.now() - stuckSince > HTTP_STUCK_MS) {
            stopHttp(tile);
            startPictures(tile);
          }
        }, 2000);
        return true;
      }

      function stopHttp(tile) {
        const http = tile.http;
        if (!http) return;
        http.stopped = true;
        clearTimeout(http.timer);
        clearInterval(http.watchdog);
        try { if (http.ms.readyState === 'open') http.ms.endOfStream(); } catch (e) { /* ignore */ }
        URL.revokeObjectURL(http.url);
        if (!tile.video.srcObject) {
          tile.video.removeAttribute('src');
          tile.video.load();
        }
        tile.http = null;
      }

      // WebRTC didn't come up: HTTP video if the browser can play it, else pictures. Live
      // WebRTC is tried again later either way.
      async function startFallback(tile) {
        if (!tile.http && !tile.pictureTimer) {
          const ok = await startHttp(tile);
          if (!ok) { startPictures(tile); return; }
        }
        clearTimeout(tile.liveRetry);
        tile.liveRetry = setTimeout(() => connect(tile), tile.liveRetries++ ? LIVE_RETRY_MS : LIVE_RETRY_FIRST_MS);
      }

      function stopPictures(tile) {
        clearInterval(tile.pictureTimer);
        clearTimeout(tile.liveRetry);
        tile.pictureTimer = null;
        tile.img.hidden = true;
        tile.badge.hidden = true;
      }

      async function connect(tile) {
        disconnect(tile, true);
        if (document.hidden) return;
        if (!mayGoLive(tile)) { startPictures(tile, false); return; }
        if (!tile.pictureTimer && !tile.http) tile.el.classList.remove('live');
        tile.status.textContent = Homey.__('widget.connecting');
        // Fall back (HTTP video, then pictures) if live video hasn't started in time.
        tile.liveTimer = setTimeout(() => {
          if (!tile.video.srcObject || tile.video.readyState < 2) {
            disconnect(tile, true);
            startFallback(tile);
          }
        }, LIVE_TIMEOUT_MS);
        // STUN lets the phone offer its public address too, so live video can also connect
        // from outside the home network when the mobile network allows it.
        const pc = new RTCPeerConnection({ iceServers: [{ urls: 'stun:stun.l.google.com:19302' }] });
        tile.pc = pc;
        pc.addTransceiver('video', { direction: 'recvonly' });
        pc.ontrack = (e) => {
          tile.video.srcObject = e.streams[0] || new MediaStream([e.track]);
          tile.video.play().catch(() => {});
        };
        tile.video.onplaying = () => {
          // Only WebRTC sets srcObject; HTTP video plays through src and keeps its badge.
          if (!tile.video.srcObject) return;
          clearTimeout(tile.liveTimer);
          tile.liveRetries = 0;
          stopHttp(tile);
          stopPictures(tile);
          tile.el.classList.add('live');
        };
        pc.onconnectionstatechange = () => {
          if (tile.pc !== pc || tile.pictureTimer || tile.http) return;
          if (pc.connectionState === 'failed' || pc.connectionState === 'disconnected') scheduleRetry(tile);
        };
        try {
          await pc.setLocalDescription(await pc.createOffer());
          await waitForIce(pc);
          if (tile.pc !== pc) return;
          const { answerSdp } = await Homey.api('POST', '/offer', {
            source, sourceId: tile.sourceId, sdp: pc.localDescription.sdp, quality,
          });
          if (tile.pc !== pc) return;
          await pc.setRemoteDescription({ type: 'answer', sdp: answerSdp });
        } catch (err) {
          if (tile.pictureTimer || tile.http) return;
          // Homey is already relaying as many streams as it can: fall back instead.
          if (err && /too many live streams/i.test(err.message || String(err))) {
            disconnect(tile, true);
            startFallback(tile);
            return;
          }
          tile.status.textContent = Homey.__('widget.failed');
          scheduleRetry(tile);
        }
      }

      // keepFallback: leave HTTP video or pictures running (used while trying live again).
      function disconnect(tile, keepFallback) {
        clearTimeout(tile.retry);
        clearTimeout(tile.liveTimer);
        if (tile.pc) { try { tile.pc.close(); } catch (e) { /* ignore */ } }
        tile.pc = null;
        if (tile.video.srcObject) tile.video.srcObject = null;
        if (!keepFallback) {
          stopHttp(tile);
          stopPictures(tile);
          tile.el.classList.remove('live');
        }
      }

      function scheduleRetry(tile) {
        clearTimeout(tile.retry);
        tile.el.classList.remove('live');
        tile.status.textContent = Homey.__('widget.failed');
        tile.retry = setTimeout(() => connect(tile), RETRY_MS);
      }

      function connectAll() {
        let n = 0;
        tiles.forEach((tile) => {
          if (zoomedTile && tile !== zoomedTile) return;
          setTimeout(() => connect(tile), (n++) * STAGGER_MS);
        });
      }

      function disconnectAll() {
        tiles.forEach((tile) => disconnect(tile));
      }

      // Only stream while the dashboard is visible: hidden widgets cost Homey nothing.
      document.addEventListener('visibilitychange', () => {
        if (document.hidden) disconnectAll();
        else connectAll();
      });
      window.addEventListener('pagehide', disconnectAll);

      if (!source) {
        showMessage(Homey.__('widget.pickSource'));
        Homey.ready();
        return;
      }

      Homey.api('POST', '/layout', { source }).then((layout) => {
        grid.style.gridTemplateColumns = `repeat(${layout.columns}, 1fr)`;
        grid.style.gridTemplateRows = `repeat(${layout.rows}, 1fr)`;
        // The same camera can appear in several tiles; stream it once per tile anyway
        // (Homey shares the Camera Station stream between them).
        for (const t of layout.tiles) {
          const el = document.createElement('div');
          el.className = 'tile';
          el.style.gridRow = `${t.row + 1} / span ${t.rowSpan}`;
          el.style.gridColumn = `${t.column + 1} / span ${t.columnSpan}`;
          const video = document.createElement('video');
          video.muted = true;
          video.autoplay = true;
          video.playsInline = true;
          const label = document.createElement('span');
          label.className = 'label';
          label.textContent = t.name;
          const status = document.createElement('span');
          status.className = 'status';
          const img = document.createElement('img');
          img.hidden = true;
          img.alt = '';
          const badge = document.createElement('span');
          badge.className = 'badge';
          badge.hidden = true;
          el.append(video, img, label, badge, status);
          grid.append(el);
          const tile = {
            el, video, img, badge, status, sourceId: t.sourceId, liveRetries: 0, index: tiles.length,
          };
          tiles.push(tile);
          el.addEventListener('click', () => {
            try { Homey.hapticFeedback(); } catch (e) { /* not available */ }
            if (layout.tiles.length < 2) {
              if (tile.pc === null && !tile.pictureTimer) connect(tile);
              return;
            }
            const zoomed = el.classList.toggle('zoom');
            tiles.forEach((o) => { if (o !== tile) o.el.classList.remove('zoom'); });
            grid.classList.toggle('zoomed', zoomed);
            // Enlarged: only this tile streams (live). Back to the grid: the normal set.
            zoomedTile = zoomed ? tile : null;
            disconnectAll();
            connectAll();
          });
        }
        Homey.ready();
        connectAll();
      }).catch((err) => {
        showMessage(err && err.message ? err.message : String(err));
        Homey.ready();
      });
    }
  </script>
</body>
</html>
